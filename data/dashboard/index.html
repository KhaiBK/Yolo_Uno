<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>ESP32 Dashboard</h1>
  </header>
  <main class="grid-container">
    <!-- LED RGB Card -->
    <section class="card rgb-card">
      <h2>RGB Control</h2>
      <div class="form-group">
        <label for="rgbMode">Mode:</label>
        <select id="rgbMode">
          <option value="RGB_OFF">Off</option>
          <option value="RGB_AUTO">Auto</option>
          <option value="RGB_FADE">Fade</option>
          <option value="RGB_MANUAL">Manual</option>
        </select>
      </div>
      <div id="manualControls" class="form-group hidden">
        <label for="colorPicker">Color:</label>
        <input type="color" id="colorPicker" value="#00ffcc">
        <label for="brightness">Brightness:</label>
        <input type="range" id="brightness" min="0" max="255" value="128">
      </div>
      <button id="applyRgb" class="btn-primary">Apply</button>
    </section>

    <!-- LED On/Off Card -->
    <section class="card led-card">
      <h2>LED</h2>
      <button id="ledToggle" class="btn-toggle">Turn On</button>
    </section>

    <!-- Sensor Data Card -->
    <section class="card sensor-card">
      <h2>Sensor Data</h2>
      <ul>
        <li><span>Temperature</span><span id="temp">--</span> °C</li>
        <li><span>Humidity   </span><span id="humi">--</span> %</li>
        <li><span>Light       </span><span id="light">--</span> lx</li>
        <li><span>Soil        </span><span id="soil">--</span> %</li>
        <li><span>Distance    </span><span id="dist">--</span> cm</li>
      </ul>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
